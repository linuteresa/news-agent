name: Daily News Agent

on:
  schedule:
    - cron: '7 15 * * *' # Runs every day at 15:07 UTC (10:07 AM EST / 11:07 AM EDT) — offset from :00 to avoid GitHub's top-of-hour scheduling delays
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install feedparser google-genai python-dotenv
      - name: Run Agent
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
          EMAIL_RECEIVER2: ${{ secrets.EMAIL_RECEIVER2 }}
          EMAIL_RECEIVER3: ${{ secrets.EMAIL_RECEIVER3 }}
          EMAIL_RECEIVER4: ${{ secrets.EMAIL_RECEIVER4 }}
          NUM_ARTICLES: ${{ secrets.NUM_ARTICLES }}
        run: python email_agent.py
